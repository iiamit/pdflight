# How to find each anchor in each source document.
#
# Anchor refs are logical, never page numbers. Resolution priority is set in
# CLAUDE.md section 8 and implemented in tools/resolve.py:
#
#   1. native   already a destination in a generated PDF. Every CFR section.
#   2. outline  a normalised bookmark title. Works for 30 of 40 documents.
#   3. regex    extracted page text with an ordinal. Needed where the outline
#               is missing or is tagged-PDF noise.
#   4. pinned   a literal page number. Warns every run.
#
# Generated from observed evidence, then committed. Every pattern here matched
# when it was written; `make resolve` fails if one stops matching.
#
# PHAK and IFH use regex rather than outline on purpose. PHAK's 7,689 bookmarks
# are tagged-PDF structure, not headings, and IFH has no outline at all. Both
# expose a standalone "Chapter N" line on each chapter opening page, and
# contents pages are excluded by the indexer so those lines cannot match the
# table of contents instead.

# phak: regex, because its outline is tagged-PDF structure noise
phak:ch01:
  doc: phak
  strategy: regex
  pattern: '^\s*Chapter\s+1\s*$'
  ordinal: 1
phak:ch02:
  doc: phak
  strategy: regex
  pattern: '^\s*Chapter\s+2\s*$'
  ordinal: 1
